<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Feedback Form</title>
</head>

<body class="bg-primary-subtle">
    <div class="container">
        <div class="row">

            <header class="col">
                <nav class="navbar bg-dark text-white">
                    <ul class="nav">
                        <li class="nav-item fw-normal px-5 mx-4">
                            <a href="https://www.usca.edu">USCA Main Website</a>
                        </li>
                        <li class="nav-item fw-normal px-5 mx-4">
                            <a href="index.html#introduction">Introduction</a>
                        </li>
                        <li class="nav-item fw-normal px-5 mx-4">
                            <a href="index.html#portfolio">Portfolio</a>
                        </li>
                        <li class="nav-item fw-normal px-5 mx-4">
                            <a href="index.html#schedule">Schedule</a>
                        </li>
                        <li class="nav-item fw-normal px-5 mx-4">
                            <a href="index.html#assignment">Assignments</a>
                        </li>
                    </ul>
                </nav>
            </header>
        </div>


        <main class="row">
            <section class="col">

                <h1 class="collapse">Feedback Form</h1>

                <p class="border border-5 border-primary">
                    <style>
                        video {
                            width: 100%;
                            height: 100%;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                        }
                    </style>
                    <video src="img/waterfall.mp4" controls autoplay muted loop></video>
                </p>
            </section>




            <section class="col">

                <form name="feedback">

                    <p class="form-floating">
                        <label for="fname">First Name:</label><br>
                        <input type="text" id="fname" name="fname" class="form-control form-text text-muted" placeholder="Anonymous"
                            required>
                    </p>

                    <p class="form-floating">
                        <label for="lname">Last Name:</label><br>
                        <input type="text" id="lname" name="lname" class="form-control form-text text-muted" placeholder="Anonymous"
                            required>
                    </p>

                    <p class="form-floating">
                        <label for="mail">Email:</label><br>
                        <input type="email" id="mail" name="mail" class="form-control form-text text-muted" placeholder="name@domain.com">
                    </p>

                    <p class="form-floating">
                        <label for="phone">Phone Number:</label><br>
                        <input type="tel" id="phone" name="phone" class="form-control form-text text-muted" placeholder="(123) 456-7890">
                    </p>


                    <p class="form-floating">
                        <label for="calendar">Preferred Meeting Date:</label><br>
                        <input type="date" id="calendar" name="calendar" class="form-control form-text text-muted">
                    </p>

                    <p class="form-floating">
                        <label for="time">Preferred Meeting Time:</label><br>
                        <input type="time" id="time" name="time" class="form-control form-text text-muted">
                    </p>

                    <p>
                        <label for="contact">Preferred Contact Method:</label><br>
                        <select class="form-control" id="contact" name="contact">
                            <option value="email">Email</option>
                            <option value="phone">Phone</option>
                            <option value="text">Text</option>
                        </select>
                    </p>

                    <p>
                        <label for="radio">Would you recommend this website?</label><br>
                        <input type="radio" id="radio1" name="radio" value="Yes" class="form-check-input">
                        <label for="radio1" class="form-check-label">Yes</label>
                        <input type="radio" id="radio2" name="radio" value="No" class="form-check-input">
                        <label for="radio2" class="form-check-label">No</label>
                    </p>

                    <p>
                        <label for="checkbox">What is your favorite website?</label><br>
                        <select id="checkbox" name="checkbox" multiple class="form-control">
                            <option value="google">Google</option>
                            <option value="youtube">YouTube</option>
                            <option value="facebook">Facebook</option>
                            <option value="twitter">Twitter</option>
                            <option value="instagram">Instagram</option>
                            <option value="tiktok">TikTok</option>
                        </select>
                    </p>

                    <p>
                        <label for="rating">How likely are you to recommend this website on a scale of 1 to 10?</label><br>
                        <input type="range" id="rating" name="rating" min="1" max="10" class="form-range">
                    </p>

                    <p>
                        <label for="comment">Comments:</label><br>
                        <textarea id="comment" name="comment" rows="4" cols="50" maxlength="300" class="form-control text-wrap"
                            placeholder="Enter your comments here..."></textarea>
                    </p>

                    <input type="submit" value="Submit"  class="mb-5">

                </form>
            </section>

        </main>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
